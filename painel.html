<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google" content="notranslate">

<title>Painel da Prefeitura</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:#f5f5f5;
}

header{
    background:#4b2e18;
    border-bottom:4px solid #2d1b0f;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:26px;
}

header p{
    margin:0;
    color:#ddd;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.abas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.aba{
    border:none;
    background:#333;
    color:#fff;
    padding:12px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    flex:1 1 30%;
}

.aba:hover{
    background:#555;
}

.aba.ativa{
    background:#6b451f;
}

.secao{
    display:none;
}

.secao.ativa{
    display:block;
}

.card,
.formulario{
    background:#292929;
    border:2px solid #444;
    border-radius:8px;
    padding:18px;
    margin-bottom:15px;
}

.formulario{
    background:#252525;
}

.card h2,
.formulario h2{
    margin-top:0;
    color:#ffd27a;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:7px 0 14px;
    border:2px solid #555;
    border-radius:6px;
    background:#151515;
    color:#fff;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:none;
    border-radius:6px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
    margin:3px;
}

button:active{
    transform:scale(.98);
}

.btn-principal{
    background:#4caf50;
    color:#fff;
}

.btn-editar{
    background:#d69e2e;
    color:#fff;
}

.btn-excluir{
    background:#c0392b;
    color:#fff;
}

.btn-atualizar{
    background:#357edd;
    color:#fff;
}

.btn-cancelar{
    background:#666;
    color:#fff;
}

.mensagem{
    padding:12px;
    border-radius:6px;
    margin:10px 0;
    display:none;
}

.mensagem.sucesso{
    display:block;
    background:#174d25;
    border:1px solid #2e8b45;
}

.mensagem.erro{
    display:block;
    background:#5c1f1f;
    border:1px solid #a33;
}

.item{
    background:#202020;
    border:1px solid #444;
    border-radius:7px;
    padding:15px;
    margin-top:12px;
}

.item h3{
    margin-top:0;
    color:#ffd27a;
}

.item small{
    color:#aaa;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
    margin:8px 0;
}

.status-planejada{
    background:#555;
}

.status-analise{
    background:#8a6d1d;
}

.status-aprovada{
    background:#245a91;
}

.status-andamento{
    background:#a05a18;
}

.status-concluida{
    background:#27753b;
}

.status-recusada{
    background:#8c2929;
}

.vazio{
    color:#aaa;
    padding:15px 0;
}

.carregando{
    color:#aaa;
    padding:15px 0;
}

.codigo{
    background:#111;
    border:1px solid #555;
    padding:8px 12px;
    display:inline-block;
    border-radius:5px;
    font-weight:bold;
}

.erro-javascript{
    background:#7b1e1e;
    color:#fff;
    padding:15px;
    margin:15px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

@media(max-width:600px){

    header h1{
        font-size:22px;
    }

    .aba{
        flex:1 1 45%;
    }

    .container{
        width:94%;
    }

}

</style>
</head>

<body>

<header>
    <h1>🏛️ Painel da Prefeitura</h1>
    <p>Administração do site da prefeitura</p>
</header>

<div class="container">

    <div id="mensagemGlobal" class="mensagem"></div>

    <div class="abas">

        <button type="button" class="aba ativa" data-aba="avisos">
            📢 Avisos
        </button>

        <button type="button" class="aba" data-aba="propostas">
            📜 Propostas
        </button>

        <button type="button" class="aba" data-aba="construcoes">
            🏗️ Construções
        </button>

        <button type="button" class="aba" data-aba="solicitacoes">
            📬 Solicitações
        </button>

        <button type="button" class="aba" data-aba="ideias">
            💡 Sugestões
        </button>

        <button type="button" class="aba" data-aba="denuncias">
            🚨 Denúncias
        </button>

    </div>


    <!-- AVISOS -->

    <section id="avisos" class="secao ativa">

        <div class="formulario">

            <h2>📢 Novo aviso</h2>

            <input
                id="avisoTitulo"
                type="text"
                placeholder="Título do aviso"
            >

            <textarea
                id="avisoTexto"
                placeholder="Escreva o aviso..."
            ></textarea>

            <button
                type="button"
                id="btnSalvarAviso"
                class="btn-principal"
            >
                Publicar aviso
            </button>

            <button
                type="button"
                id="btnLimparAviso"
                class="btn-cancelar"
            >
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Avisos publicados</h2>

            <div id="listaAvisos"></div>

        </div>

    </section>


    <!-- PROPOSTAS -->

    <section id="propostas" class="secao">

        <div class="formulario">

            <h2>📜 Nova proposta</h2>

            <input
                id="propostaTitulo"
                type="text"
                placeholder="Título da proposta"
            >

            <textarea
                id="propostaTexto"
                placeholder="Descrição da proposta..."
            ></textarea>

            <button
                type="button"
                id="btnSalvarProposta"
                class="btn-principal"
            >
                Publicar proposta
            </button>

            <button
                type="button"
                id="btnLimparProposta"
                class="btn-cancelar"
            >
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Propostas publicadas</h2>

            <div id="listaPropostas"></div>

        </div>

    </section>


    <!-- CONSTRUÇÕES -->

    <section id="construcoes" class="secao">

        <div class="formulario">

            <h2>🏗️ Nova construção / projeto</h2>

            <input
                id="construcaoTitulo"
                type="text"
                placeholder="Nome da construção"
            >

            <textarea
                id="construcaoDescricao"
                placeholder="Descrição do projeto..."
            ></textarea>

            <select id="construcaoStatus">

                <option value="Planejada">
                    Planejada
                </option>

                <option value="Em andamento">
                    Em andamento
                </option>

                <option value="Concluída">
                    Concluída
                </option>

            </select>

            <button
                type="button"
                id="btnSalvarConstrucao"
                class="btn-principal"
            >
                Salvar construção
            </button>

            <button
                type="button"
                id="btnLimparConstrucao"
                class="btn-cancelar"
            >
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Construções / projetos</h2>

            <div id="listaConstrucoes"></div>

        </div>

    </section>


    <!-- SOLICITAÇÕES -->

    <section id="solicitacoes" class="secao">

        <div class="card">

            <h2>📬 Solicitações dos moradores</h2>

            <button
                type="button"
                id="btnAtualizarSolicitacoes"
                class="btn-atualizar"
            >
                🔄 Atualizar
            </button>

            <div id="listaSolicitacoes"></div>

        </div>

    </section>


    <!-- SUGESTÕES -->

    <section id="ideias" class="secao">

        <div class="card">

            <h2>💡 Sugestões dos moradores</h2>

            <button
                type="button"
                id="btnAtualizarIdeias"
                class="btn-atualizar"
            >
                🔄 Atualizar
            </button>

            <div id="listaIdeias"></div>

        </div>

    </section>


    <!-- DENÚNCIAS -->

    <section id="denuncias" class="secao">

        <div class="card">

            <h2>🚨 Denúncias dos moradores</h2>

            <button
                type="button"
                id="btnAtualizarDenuncias"
                class="btn-atualizar"
            >
                🔄 Atualizar
            </button>

            <div id="listaDenuncias"></div>

        </div>

    </section>

</div>


<script>

/*
    ==========================================
    CONFIGURAÇÃO DO SUPABASE
    ==========================================
*/

const SUPABASE_URL =
    "https://oamvfvyuaqolsswklljp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";


/*
    ==========================================
    VARIÁVEIS
    ==========================================
*/

let avisoEditando = null;
let propostaEditando = null;
let construcaoEditando = null;


/*
    ==========================================
    MENSAGENS
    ==========================================
*/

function mostrarMensagem(texto, tipo) {

    const elemento =
        document.getElementById("mensagemGlobal");

    elemento.textContent = texto;

    elemento.className =
        "mensagem " + (tipo || "sucesso");

    setTimeout(function() {

        elemento.className = "mensagem";

    }, 4000);
}


/*
    ==========================================
    ESCAPAR TEXTO
    ==========================================
*/

function escapar(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
    ==========================================
    REQUISIÇÃO AO SUPABASE
    ==========================================
*/

async function requisicao(
    tabela,
    metodo,
    dados,
    query
) {

    let url =
        SUPABASE_URL +
        "/rest/v1/" +
        tabela;

    if (query) {
        url += "?" + query;
    }

    const opcoes = {

        method: metodo || "GET",

        headers: {

            "Content-Type":
                "application/json",

            "apikey":
                SUPABASE_KEY,

            "Authorization":
                "Bearer " + SUPABASE_KEY,

            "Prefer":
                "return=representation"

        }

    };

    if (dados !== null && dados !== undefined) {

        opcoes.body =
            JSON.stringify(dados);

    }

    const resposta =
        await fetch(url, opcoes);

    const texto =
        await resposta.text();

    if (!resposta.ok) {

        throw new Error(
            "Erro " +
            resposta.status +
            ": " +
            texto
        );

    }

    if (!texto) {
        return null;
    }

    try {

        return JSON.parse(texto);

    } catch (erro) {

        return texto;

    }

}


/*
    ==========================================
    ABRIR ABAS
    ==========================================
*/

function abrirAba(nome) {

    const secoes =
        document.querySelectorAll(".secao");

    secoes.forEach(function(secao) {

        secao.classList.remove("ativa");

    });


    const botoes =
        document.querySelectorAll(".aba");

    botoes.forEach(function(botao) {

        botao.classList.remove("ativa");

    });


    const secao =
        document.getElementById(nome);

    const botao =
        document.querySelector(
            '.aba[data-aba="' +
            nome +
            '"]'
        );


    if (!secao) {
        return;
    }


    secao.classList.add("ativa");


    if (botao) {
        botao.classList.add("ativa");
    }


    if (nome === "avisos") {
        carregarAvisos();
    }

    if (nome === "propostas") {
        carregarPropostas();
    }

    if (nome === "construcoes") {
        carregarConstrucoes();
    }

    if (nome === "solicitacoes") {
        carregarSolicitacoes();
    }

    if (nome === "ideias") {
        carregarIdeias();
    }

    if (nome === "denuncias") {
        carregarDenuncias();
    }

}


/*
    ==========================================
    AVISOS
    ==========================================
*/

async function carregarAvisos() {

    const lista =
        document.getElementById("listaAvisos");

    lista.innerHTML =
        '<div class="carregando">Carregando...</div>';

    try {

        const dados =
            await requisicao(
                "avisos",
                "GET",
                null,
                "select=*&order=id.desc"
            );


        if (!dados || dados.length === 0) {

            lista.innerHTML =
                '<div class="vazio">' +
                'Nenhum aviso publicado.' +
                '</div>';

            return;
        }


        lista.innerHTML =
            dados.map(function(aviso) {

                return `
                    <div class="item">

                        <h3>
                            ${escapar(aviso.titulo)}
                        </h3>

                        <p>
                            ${escapar(aviso.texto)
                                .replace(/\n/g, "<br>")}
                        </p>

                        <small>
                            ID: ${escapar(aviso.id)}
                        </small>

                        <br><br>

                        <button
                            type="button"
                            class="btn-editar btn-editar-aviso"
                            data-id="${Number(aviso.id)}"
                        >
                            ✏️ Editar
                        </button>

                        <button
                            type="button"
                            class="btn-excluir btn-excluir-aviso"
                            data-id="${Number(aviso.id)}"
                        >
                            🗑️ Excluir
                        </button>

                    </div>
                `;

            }).join("");


        document
            .querySelectorAll(".btn-editar-aviso")
            .forEach(function(botao) {

                botao.addEventListener(
                    "click",
                    function() {

                        editarAviso(
                            Number(botao.dataset.id)
                        );

                    }
                );

            });


        document
            .querySelectorAll(".btn-excluir-aviso")
            .forEach(function(botao) {

                botao.addEventListener(
                    "click",
                    function() {

                        excluirAviso(
                            Number(botao.dataset.id)
                        );

                    }
                );

            });


    } catch (erro) {

        lista.innerHTML =
            '<div class="vazio">' +
            'Erro: ' +
            escapar(erro.message) +
            '</div>';

    }

}


async function salvarAviso() {

    const titulo =
        document
            .getElementById("avisoTitulo")
            .value
            .trim();

    const texto =
        document
            .getElementById("avisoTexto")
            .value
            .trim();


    if (!titulo || !texto) {

        mostrarMensagem(
            "Preencha o título e o texto do aviso.",
            "erro"
        );

        return;
    }


    try {

        if (avisoEditando !== null) {

            await requisicao(
                "avisos",
                "PATCH",
                {
                    titulo: titulo,
                    texto: texto
                },
                "id=eq." +
                encodeURIComponent(avisoEditando)
            );

            mostrarMensagem(
                "Aviso atualizado!"
            );

        } else {

            await requisicao(
                "avisos",
                "POST",
                {
                    titulo: titulo,
                    texto: texto
                }
            );

            mostrarMensagem(
                "Aviso publicado!"
            );

        }


        limparFormularioAviso();

        await carregarAvisos();


    } catch (erro) {

        mostrarMensagem(
            erro.message,
            "erro"
        );

    }

}


async function editarAviso(id) {

    try {

        const dados =
            await requisicao(
                "avisos",
                "GET",
                null,
                "select=*&id=eq." +
                encodeURIComponent(id)
            );


        if (!dados || dados.length === 0) {
            return;
        }


        document
            .getElementById("avisoTitulo")
            .value =
            dados[0].titulo || "";


        document
            .getElementById("avisoTexto")
            .value =
            dados[0].texto || "";


        avisoEditando = id;


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (erro) {

        mostrarMensagem(
            erro.message,
            "erro"
        );

    }

}


async function excluirAviso(id) {

    if (!confirm("Excluir este aviso?")) {
        return;
    }


    try {

        await requisicao(
            "avisos",
            "DELETE",
            null,
            "id=eq." +
            encodeURIComponent(id)
        );


        mostrarMensagem(
            "Aviso excluído."
        );


        await carregarAvisos();


    } catch (erro) {

        mostrarMensagem(
            erro.message,
            "erro"
        );

    }

}


function limparFormularioAviso() {

    document
        .getElementById("avisoTitulo")
        .value = "";

    document
        .getElementById("avisoTexto")
        .value = "";

    avisoEditando = null;

}


/*
    ==========================================
    PROPOSTAS
    ==========================================
*/

async function carregarPropostas() {

    const lista =
        document.getElementById("listaPropostas");

    lista.innerHTML =
        '<div class="carregando">Carregando...</div>';


    try {

        const dados =
            await requisicao(
                "propostas",
                "GET",
                null,
                "select=*&order=id.desc"
            );


        if (!dados || dados.length === 0) {

            lista.innerHTML =
                '<div class="vazio">' +
                'Nenhuma proposta publicada.' +
                '</div>';

            return;
        }


        lista.innerHTML =
            dados.map(function(proposta) {

                return `
                    <div class="item">

                        <h3>
                            ${escapar(proposta.titulo)}
                        </h3>

                        <p>
                            ${escapar(proposta.texto)
                                .replace(/\n/g, "<br>")}
                        </p>

                        <small>
                            ID: ${escapar(proposta.id)}
                        </small>

                        <br><br>

                        <button
                            type="button"
                            class="btn-editar btn-editar-proposta"
                            data-id="${Number(proposta.id)}"
                        >
                            ✏️ Editar
                        </button>
