<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Painel da Prefeitura</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#1b1b1b;
  color:#f5f5f5;
}

header{
  background:#4b2e18;
  border-bottom:4px solid #2d1b0f;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
  font-size:26px;
}

header p{
  margin:0;
  color:#ddd;
}

.container{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

.abas{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.aba{
  border:none;
  background:#333;
  color:#fff;
  padding:12px 15px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  flex:1 1 30%;
}

.aba:hover,
.aba.ativa{
  background:#6b451f;
}

.secao{
  display:none;
}

.secao.ativa{
  display:block;
}

.card,
.formulario{
  background:#292929;
  border:2px solid #444;
  border-radius:8px;
  padding:18px;
  margin-bottom:15px;
}

.formulario{
  background:#252525;
}

.card h2,
.formulario h2{
  margin-top:0;
  color:#ffd27a;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:2px solid #555;
  border-radius:6px;
  background:#151515;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:none;
  border-radius:6px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  margin:3px;
}

.btn-principal{
  background:#4caf50;
  color:#fff;
}

.btn-editar{
  background:#d69e2e;
  color:#fff;
}

.btn-excluir{
  background:#c0392b;
  color:#fff;
}

.btn-atualizar{
  background:#357edd;
  color:#fff;
}

.btn-cancelar{
  background:#666;
  color:#fff;
}

.mensagem{
  padding:12px;
  border-radius:6px;
  margin:10px 0;
  display:none;
}

.sucesso{
  display:block;
  background:#174d25;
  border:1px solid #2e8b45;
}

.erro{
  display:block;
  background:#5c1f1f;
  border:1px solid #a33;
}

.item{
  background:#202020;
  border:1px solid #444;
  border-radius:7px;
  padding:15px;
  margin-top:12px;
}

.item h3{
  margin-top:0;
  color:#ffd27a;
}

.item small{
  color:#aaa;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-weight:bold;
  margin:8px 0;
  background:#555;
}

.vazio{
  color:#aaa;
  padding:15px 0;
}

.campo-generico{
  margin:8px 0;
}

.campo-generico strong{
  color:#ffd27a;
}

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .aba{
    flex:1 1 45%;
  }

  .container{
    width:94%;
  }
}
</style>
</head>

<script>

/* ==========================================
   CONFIGURAÇÃO SUPABASE
========================================== */

const SUPABASE_URL =
"https://oamvfvyuaqolsswklljp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";


/* ==========================================
   CONTROLE DE EDIÇÃO
========================================== */

let propostaEditando = null;

let construcaoEditando = null;


/* ==========================================
   MENSAGENS
========================================== */

function mostrarMensagem(texto,tipo="sucesso"){

  const el =
  document.getElementById("mensagemGlobal");

  el.textContent = texto;

  el.className =
  "mensagem " + tipo;

  setTimeout(()=>{

    el.className = "mensagem";

  },4000);
}


/* ==========================================
   SEGURANÇA DO TEXTO
========================================== */

function escapar(valor){

  return String(valor ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* ==========================================
   REQUISIÇÃO SUPABASE
========================================== */

async function requisicao(
  tabela,
  metodo="GET",
  dados=null,
  query=""
){

  let url =
  SUPABASE_URL +
  "/rest/v1/" +
  tabela;

  if(query){

    url += "?" + query;

  }

  const opcoes = {

    method:metodo,

    headers:{

      "Content-Type":
      "application/json",

      "apikey":
      SUPABASE_KEY,

      "Authorization":
      "Bearer " + SUPABASE_KEY,

      "Prefer":
      "return=representation"

    }

  };


  if(dados !== null){

    opcoes.body =
    JSON.stringify(dados);

  }


  const resposta =
  await fetch(url,opcoes);


  const texto =
  await resposta.text();


  if(!resposta.ok){

    throw new Error(
      "Erro " +
      resposta.status +
      ": " +
      texto
    );

  }


  if(!texto){

    return null;

  }


  try{

    return JSON.parse(texto);

  }catch{

    return texto;

  }

}


/* ==========================================
   ABRIR ABA
========================================== */

function abrirAba(nome,botao){

  document
  .querySelectorAll(".secao")
  .forEach(secao=>{

    secao.classList.remove("ativa");

  });


  document
  .querySelectorAll(".aba")
  .forEach(aba=>{

    aba.classList.remove("ativa");

  });


  const secao =
  document.getElementById(nome);


  if(!secao){

    return;

  }


  secao.classList.add("ativa");


  if(botao){

    botao.classList.add("ativa");

  }


  if(nome === "avisos"){

    carregarAvisos();

  }


  if(nome === "propostas"){

    carregarPropostas();

  }


  if(nome === "construcoes"){

    carregarConstrucoes();

  }


  if(nome === "solicitacoes"){

    carregarSolicitacoes();

  }


  if(nome === "ideias"){

    carregarIdeias();

  }


  if(nome === "denuncias"){

    carregarDenuncias();

  }

}


/* ==========================================
   AVISOS
   TABELA:
   id
   data
   texto
========================================== */

async function carregarAvisos(){

  const lista =
  document.getElementById(
    "listaAvisos"
  );

  lista.innerHTML =
  "Carregando...";


  try{

    const dados =
    await requisicao(
      "avisos",
      "GET",
      null,
      "select=*&order=id.desc"
    );


    if(!dados || !dados.length){

      lista.innerHTML =
      '<div class="vazio">Nenhum aviso publicado.</div>';

      return;

    }


    lista.innerHTML =
    dados.map(aviso=>`

      <div class="item">

        <h3>📢 Aviso</h3>

        <p>
          ${escapar(aviso.texto)
          .replace(/\n/g,"<br>")}
        </p>

        <small>
          ID: ${escapar(aviso.id)}
        </small>

        <br>

        <small>
          Data: ${escapar(aviso.data || "Não informada")}
        </small>

      </div>

    `).join("");


  }catch(e){

    lista.innerHTML =
    '<div class="vazio">Erro: ' +
    escapar(e.message) +
    '</div>';

  }

}


async function salvarAviso(){

  const texto =
  document
  .getElementById("avisoTexto")
  .value
  .trim();


  if(!texto){

    mostrarMensagem(
      "Escreva o texto do aviso.",
      "erro"
    );

    return;

  }


  try{

    await requisicao(
      "avisos",
      "POST",
      {
        texto: texto
      }
    );


    mostrarMensagem(
      "Aviso publicado com sucesso!"
    );


    limparFormularioAviso();

    carregarAvisos();


  }catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }

}


function limparFormularioAviso(){

  document
  .getElementById("avisoTexto")
  .value = "";

}


/* ==========================================
   PROPOSTAS
   TABELA:
   id
   titulo
   descricao
   eleicao
========================================== */

async function carregarPropostas(){

  const lista =
  document.getElementById(
    "listaPropostas"
  );

  lista.innerHTML =
  "Carregando...";


  try{

    const dados =
    await requisicao(
      "propostas",
      "GET",
      null,
      "select=*&order=id.desc"
    );


    if(!dados || !dados.length){

      lista.innerHTML =
      '<div class="vazio">Nenhuma proposta publicada.</div>';

      return;

    }


    lista.innerHTML =
    dados.map(proposta=>`

      <div class="item">

        <h3>
          ${escapar(proposta.titulo)}
        </h3>

        <p>
          ${escapar(proposta.descricao)
          .replace(/\n/g,"<br>")}
        </p>

        <p>
          <strong>Eleição:</strong>
          ${escapar(proposta.eleicao || "Não informada")}
        </p>

        <small>
          ID: ${escapar(proposta.id)}
        </small>

        <br><br>

        <button
        class="btn-editar"
        onclick="editarProposta(${Number(proposta.id)})">
          ✏️ Editar
        </button>

        <button
        class="btn-excluir"
        onclick="excluirProposta(${Number(proposta.id)})">
          🗑️ Excluir
        </button>

      </div>

    `).join("");


  }catch(e){

    lista.innerHTML =
    '<div class="vazio">Erro: ' +
    escapar(e.message) +
    '</div>';

  }

}


async function salvarProposta(){

  const titulo =
  document
  .getElementById("propostaTitulo")
  .value
  .trim();


  const descricao =
  document
  .getElementById("propostaDescricao")
  .value
  .trim();


  const eleicao =
  document
  .getElementById("propostaEleicao")
  .value
  .trim();


  if(!titulo || !descricao){

    mostrarMensagem(
      "Preencha o título e a descrição da proposta.",
      "erro"
    );

    return;

  }


  try{

    const dados = {

      titulo: titulo,

      descricao: descricao,

      eleicao: eleicao || null

    };


    if(propostaEditando !== null){

      await requisicao(
        "propostas",
        "PATCH",
        dados,
        "id=eq." +
        encodeURIComponent(
          propostaEditando
        )
      );


      mostrarMensagem(
        "Proposta atualizada!"
      );

    }else{

      await requisicao(
        "propostas",
        "POST",
        dados
      );


      mostrarMensagem(
        "Proposta publicada!"
      );

    }


    limparFormularioProposta();

    carregarPropostas();


  }catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }

}


async function editarProposta(id){

  try{

    const dados =
    await requisicao(
      "propostas",
      "GET",
      null,
      "select=*&id=eq." +
      encodeURIComponent(id)
    );


    if(!dados || !dados.length){

      return;

    }


    document
    .getElementById("propostaTitulo")
    .value =
    dados[0].titulo || "";


    document
    .getElementById("propostaDescricao")
    .value =
    dados[0].descricao || "";


    document
    .getElementById("propostaEleicao")
    .value =
    dados[0].eleicao || "";


    propostaEditando = id;


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


    mostrarMensagem(
      "Proposta carregada para edição."
    );


  }catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }

}


async function excluirProposta(id){

  if(!confirm(
    "Excluir esta proposta?"
  )){

    return;

  }


  try{

    await requisicao(
      "propostas",
      "DELETE",
      null,
      "id=eq." +
      encodeURIComponent(id)
    );


    mostrarMensagem(
      "Proposta excluída."
    );


    carregarPropostas();


  }catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }

}


function limparFormularioProposta(){

  document
  .getElementById("propostaTitulo")
  .value = "";


  document
  .getElementById("propostaDescricao")
  .value = "";


  document
  .getElementById("propostaEleicao")
  .value = "";


  propostaEditando = null;

}


/* ==========================================
   CONSTRUÇÕES
========================================== */

async function carregarConstrucoes(){

  const lista =
  document.getElementById(
    "listaConstrucoes"
  );

  lista.innerHTML =
  "Carregando...";


  try{

    const dados =
    await requisicao(
      "construcoes",
      "GET",
      null,
      "select=*&order=id.desc"
    );


    if(!dados || !dados.length){

      lista.innerHTML =
      '<div class="vazio">Nenhuma construção cadastrada.</div>';

      return;

    }


    lista.innerHTML =
    dados.map(c=>`

      <div class="item">

        <h3>
          🏗️ ${escapar(c.titulo)}
        </h3>

        <p>
          ${escapar(c.descricao)
          .replace(/\n/g,"<br>")}
        </p>

        <span class="status">
          ${escapar(
            c.status || "Planejada"
          )}
        </span>

        <br>

        <small>
          ID: ${escapar(c.id)}
        </small>

        <br><br>

        <button
        class="btn-editar"
        onclick="editarConstrucao(${Number(c.id)})">
          ✏️ Editar
        </button>

        <button
        class="btn-excluir"
        onclick="excluirConstrucao(${Number(c.id)})">

        </button>

  }catch(e){

    lista.innerHTML =
    '<div class="vazio">Erro: ' +
    escapar(e.message) +
    '</div>';

  }

}

    );

  .getElementById("construcaoStatus")
  .value =

/* ==========================================
   LEITURA GENÉRICA
   PARA SOLICITAÇÕES,
   IDEIAS E DENÚNCIAS
========================================== */

function formatarRegistro(item){

  let html = "";


  Object.keys(item).forEach(chave=>{

    let valor = item[chave];


    if(valor === null ||
       valor === undefined ||
       valor === ""){

      return;

    }


    if(typeof valor === "object"){

      valor =
      JSON.stringify(valor);

    }


    html += `

      <div class="campo-generico">

        <strong>
          ${escapar(chave)}:
        </strong>

        ${escapar(valor)
        .replace(/\n/g,"<br>")}

      </div>

    `;

  });


  return html;

}


    async function carregarTabelaGenerica(tabela, elementoId, nomeVazio){

  const lista =
    document.getElementById(elementoId);

  if(!lista){
    return;
  }

  lista.innerHTML = "Carregando...";

  try{

    let dados;

    try{

      dados = await requisicao(
        tabela,
        "GET",
        null,
        "select=*&order=id.desc"
      );

    }catch(erroOrdenacao){

      // Caso a tabela não possua coluna "id",
      // tenta carregar normalmente sem ordenar.
      dados = await requisicao(
        tabela,
        "GET",
        null,
        "select=*"
      );

    }


    if(!dados || !Array.isArray(dados) || !dados.length){

      lista.innerHTML =
        '<div class="vazio">' +
        escapar(nomeVazio) +
        '</div>';

      return;
    }


    lista.innerHTML =
      dados.map((item, indice)=>`

        <div class="item">

          <h3>
            ${escapar(
              item.titulo ||
              item.nome ||
              item.assunto ||
              item.tipo ||
              ("Registro #" + (indice + 1))
            )}
          </h3>

          ${formatarRegistro(item)}

        </div>

      `).join("");


  }catch(e){

    lista.innerHTML =
      '<div class="vazio">Erro ao carregar dados: ' +
      escapar(e.message) +
      '</div>';

  }

}
