<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel da Prefeitura</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:#f5f5f5;
}

header{
    background:#4b2e18;
    border-bottom:4px solid #2d1b0f;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:26px;
}

header p{
    margin:0;
    color:#ddd;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.abas{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.aba{
    border:none;
    background:#333;
    color:#fff;
    padding:12px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    flex:1 1 30%;
}

.aba:hover,
.aba.ativa{
    background:#6b451f;
}

.secao{
    display:none;
}

.secao.ativa{
    display:block;
}

.card,
.formulario{
    background:#292929;
    border:2px solid #444;
    border-radius:8px;
    padding:18px;
    margin-bottom:15px;
}

.formulario{
    background:#252525;
}

.card h2,
.formulario h2{
    margin-top:0;
    color:#ffd27a;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:7px 0 14px;
    border:2px solid #555;
    border-radius:6px;
    background:#151515;
    color:#fff;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:none;
    border-radius:6px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
    margin:3px;
}

button:active{
    transform:scale(.98);
}

.btn-principal{
    background:#4caf50;
    color:#fff;
}

.btn-editar{
    background:#d69e2e;
    color:#fff;
}

.btn-excluir{
    background:#c0392b;
    color:#fff;
}

.btn-atualizar{
    background:#357edd;
    color:#fff;
}

.btn-cancelar{
    background:#666;
    color:#fff;
}

.mensagem{
    padding:12px;
    border-radius:6px;
    margin:10px 0;
    display:none;
}

.sucesso{
    display:block;
    background:#174d25;
    border:1px solid #2e8b45;
}

.erro{
    display:block;
    background:#5c1f1f;
    border:1px solid #a33;
}

.item{
    background:#202020;
    border:1px solid #444;
    border-radius:7px;
    padding:15px;
    margin-top:12px;
}

.item h3{
    margin-top:0;
    color:#ffd27a;
}

.item small{
    color:#aaa;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
    margin:8px 0;
}

.status-planejada{
    background:#6d5a20;
}

.status-andamento{
    background:#a05a18;
}

.status-concluida{
    background:#27753b;
}

.vazio{
    color:#aaa;
    padding:15px 0;
}

.carregando{
    color:#aaa;
    padding:15px 0;
}

.erroLista{
    background:#5c1f1f;
    border:1px solid #a33;
    padding:12px;
    border-radius:6px;
    margin-top:10px;
    word-break:break-word;
}

.codigo{
    background:#111;
    border:1px solid #555;
    padding:8px 12px;
    display:inline-block;
    border-radius:5px;
    font-weight:bold;
}

@media(max-width:600px){

    header h1{
        font-size:22px;
    }

    .aba{
        flex:1 1 45%;
    }

    .container{
        width:94%;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏛️ Painel da Prefeitura</h1>
    <p>Administração do site da prefeitura</p>
</header>

<div class="container">

    <div id="mensagemGlobal" class="mensagem"></div>

    <div class="abas">

        <button type="button"
                class="aba ativa"
                onclick="abrirAba('avisos',this)">
            📢 Avisos
        </button>

        <button type="button"
                class="aba"
                onclick="abrirAba('propostas',this)">
            📜 Propostas
        </button>

        <button type="button"
                class="aba"
                onclick="abrirAba('construcoes',this)">
            🏗️ Construções
        </button>

        <button type="button"
                class="aba"
                onclick="abrirAba('solicitacoes',this)">
            📬 Solicitações
        </button>

        <button type="button"
                class="aba"
                onclick="abrirAba('ideias',this)">
            💡 Sugestões
        </button>

        <button type="button"
                class="aba"
                onclick="abrirAba('denuncias',this)">
            🚨 Denúncias
        </button>

    </div>


    <!-- ================= AVISOS ================= -->

    <section id="avisos" class="secao ativa">

        <div class="formulario">

            <h2>📢 Novo aviso</h2>

            <input
                id="avisoTitulo"
                type="text"
                placeholder="Título do aviso">

            <textarea
                id="avisoTexto"
                placeholder="Escreva o aviso..."></textarea>

            <button
                type="button"
                class="btn-principal"
                onclick="salvarAviso()">
                Publicar aviso
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="limparFormularioAviso()">
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Avisos publicados</h2>

            <div id="listaAvisos"></div>

        </div>

    </section>


    <!-- ================= PROPOSTAS ================= -->

    <section id="propostas" class="secao">

        <div class="formulario">

            <h2>📜 Nova proposta</h2>

            <input
                id="propostaTitulo"
                type="text"
                placeholder="Título da proposta">

            <textarea
                id="propostaTexto"
                placeholder="Descrição da proposta..."></textarea>

            <button
                type="button"
                class="btn-principal"
                onclick="salvarProposta()">
                Publicar proposta
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="limparFormularioProposta()">
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Propostas publicadas</h2>

            <div id="listaPropostas"></div>

        </div>

    </section>


    <!-- ================= CONSTRUÇÕES ================= -->

    <section id="construcoes" class="secao">

        <div class="formulario">

            <h2>🏗️ Nova construção / projeto</h2>

            <input
                id="construcaoTitulo"
                type="text"
                placeholder="Nome da construção">

            <textarea
                id="construcaoDescricao"
                placeholder="Descrição do projeto..."></textarea>

            <select id="construcaoStatus">

                <option value="Planejada">
                    Planejada
                </option>

                <option value="Em andamento">
                    Em andamento
                </option>

                <option value="Concluída">
                    Concluída
                </option>

            </select>

            <button
                type="button"
                class="btn-principal"
                onclick="salvarConstrucao()">
                Salvar construção
            </button>

            <button
                type="button"
                class="btn-cancelar"
                onclick="limparFormularioConstrucao()">
                Limpar
            </button>

        </div>

        <div class="card">

            <h2>Construções / projetos</h2>

            <div id="listaConstrucoes"></div>

        </div>

    </section>


    <!-- ================= SOLICITAÇÕES ================= -->

    <section id="solicitacoes" class="secao">

        <div class="card">

            <h2>📬 Solicitações dos moradores</h2>

            <button
                type="button"
                class="btn-atualizar"
                onclick="carregarSolicitacoes()">
                🔄 Atualizar
            </button>

            <div id="listaSolicitacoes"></div>

        </div>

    </section>


    <!-- ================= SUGESTÕES ================= -->

    <section id="ideias" class="secao">

        <div class="card">

            <h2>💡 Sugestões dos moradores</h2>

            <button
                type="button"
                class="btn-atualizar"
                onclick="carregarIdeias()">
                🔄 Atualizar
            </button>

            <div id="listaIdeias"></div>

        </div>

    </section>


    <!-- ================= DENÚNCIAS ================= -->

    <section id="denuncias" class="secao">

        <div class="card">

            <h2>🚨 Denúncias dos moradores</h2>

            <button
                type="button"
                class="btn-atualizar"
                onclick="carregarDenuncias()">
                🔄 Atualizar
            </button>

            <div id="listaDenuncias"></div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://oamvfvyuaqolsswklljp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";


/* =========================================================
   VARIÁVEIS
   ========================================================= */

let avisoEditando = null;
let propostaEditando = null;
let construcaoEditando = null;


/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(texto, tipo = "sucesso") {

    const el = document.getElementById("mensagemGlobal");

    el.textContent = texto;

    el.className = "mensagem " + tipo;

    setTimeout(function() {
        el.className = "mensagem";
    }, 4000);
}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapar(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   REQUISIÇÃO AO SUPABASE
   ========================================================= */

async function requisicao(
    tabela,
    metodo = "GET",
    dados = null,
    query = ""
) {

    let url =
        SUPABASE_URL +
        "/rest/v1/" +
        tabela;

    if (query) {
        url += "?" + query;
    }

    const opcoes = {

        method: metodo,

        headers: {

            "Content-Type":
                "application/json",

            "apikey":
                SUPABASE_KEY,

            "Authorization":
                "Bearer " + SUPABASE_KEY,

            "Prefer":
                "return=representation"
        }
    };

    if (dados !== null) {
        opcoes.body =
            JSON.stringify(dados);
    }

    const resposta =
        await fetch(url, opcoes);

    const texto =
        await resposta.text();

    if (!resposta.ok) {

        throw new Error(
            "Erro " +
            resposta.status +
            ": " +
            texto
        );
    }

    if (!texto) {
        return null;
    }

    try {

        return JSON.parse(texto);

    } catch {

        return texto;
    }
}


/* =========================================================
   ABAS
   ========================================================= */

function abrirAba(nome, botao) {

    document
        .querySelectorAll(".secao")
        .forEach(function(secao) {
            secao.classList.remove("ativa");
        });

    document
        .querySelectorAll(".aba")
        .forEach(function(item) {
            item.classList.remove("ativa");
        });

    const secao =
        document.getElementById(nome);

    if (!secao) {
        return;
    }

    secao.classList.add("ativa");

    if (botao) {
        botao.classList.add("ativa");
    }

    if (nome === "avisos") {
        carregarAvisos();
    }

    if (nome === "propostas") {
        carregarPropostas();
    }

    if (nome === "construcoes") {
        carregarConstrucoes();
    }

    if (nome === "solicitacoes") {
        carregarSolicitacoes();
    }

    if (nome === "ideias") {
        carregarIdeias();
    }

    if (nome === "denuncias") {
        carregarDenuncias();
    }
}


/* =========================================================
   AVISOS
   ========================================================= */

async function carregarAvisos() {

    const lista =
        document.getElementById("listaAvisos");

    lista.innerHTML =
        '<div class="carregando">Carregando...</div>';

    try {

        const dados =
            await requisicao(
                "avisos",
                "GET",
                null,
                "select=*&order=id.desc"
            );

        if (!dados || !dados.length) {

            lista.innerHTML =
                '<div class="vazio">Nenhum aviso publicado.</div>';

            return;
        }

        lista.innerHTML =
            dados.map(function(a) {

                return `
                    <div class="item">

                        <h3>
                            ${escapar(a.titulo)}
                        </h3>

                        <p>
                            ${escapar(a.texto)
                                .replace(/\n/g, "<br>")}
                        </p>

                        <small>
                            ID: ${escapar(a.id)}
                        </small>

                        <br><br>

                        <button
                            type="button"
                            class="btn-editar"
                            onclick="editarAviso(${Number(a.id)})">
                            ✏️ Editar
                        </button>

                        <button
                            type="button"
                            class="btn-excluir"
                            onclick="excluirAviso(${Number(a.id)})">
                            🗑️ Excluir
                        </button>

                    </div>
                `;

            }).join("");

    } catch (e) {

        lista.innerHTML =
            '<div class="erroLista">Erro: ' +
            escapar(e.message) +
            '</div>';
    }
}


async function salvarAviso() {

    const titulo =
        document
            .getElementById("avisoTitulo")
            .value
            .trim();

    const texto =
        document
            .getElementById("avisoTexto")
            .value
            .trim();

    if (!titulo || !texto) {

        mostrarMensagem(
            "Preencha o título e o texto do aviso.",
            "erro"
        );

        return;
    }

    try {

        if (avisoEditando !== null) {

            await requisicao(
                "avisos",
                "PATCH",
                {
                    titulo: titulo,
                    texto: texto
                },
                "id=eq." +
                encodeURIComponent(avisoEditando)
            );

            mostrarMensagem(
                "Aviso atualizado!"
            );

        } else {

            await requisicao(
                "avisos",
                "POST",
                {
                    titulo: titulo,
                    texto: texto
                }
            );

            mostrarMensagem(
                "Aviso publicado!"
            );
        }

        limparFormularioAviso();

        await carregarAvisos();

    } catch (e) {

        mostrarMensagem(
            e.message,
            "erro"
        );
    }
}


async function editarAviso(id) {

    try {

        const dados =
            await requisicao(
                "avisos",
                "GET",
                null,
                "select=*&id=eq." +
                encodeURIComponent(id)
            );

        if (!dados || !dados.length) {
            return;
        }

        document
            .getElementById("avisoTitulo")
            .value =
            dados[0].titulo || "";

        document
            .getElementById("avisoTexto")
            .value =
            dados[0].texto || "";

        avisoEditando = id;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (e) {

        mostrarMensagem(
            e.message,
            "erro"
        );
    }
}


async function excluirAviso(id) {

    if (!confirm("Excluir este aviso?")) {
        return;
    }

    try {

        await requisicao(
            "avisos",
            "DELETE",
            null,
            "id=eq." +
            encodeURIComponent(id)
        );

        mostrarMensagem(
            "Aviso excluído."
        );

        await carregarAvisos();

    } catch (e) {

        mostrarMensagem(
            e.message,
            "erro"
        );
    }
}


function limparFormularioAviso() {

    document
        .getElementById("avisoTitulo")
        .value = "";

    document
        .getElementById("avisoTexto")
        .value = "";

    avisoEditando = null;
}


/* =========================================================
   PROPOSTAS
   ========================================================= */

async function carregarPropostas() {

    const lista =
        document.getElementById("listaPropostas");

    lista.innerHTML =
        '<div class="carregando">Carregando...</div>';

    try {

        const dados =
            await requisicao(
                "propostas",
                "GET",
                null,
                "select=*&order=id.desc"
            );

        if (!dados || !dados.length) {

            lista.innerHTML =
                '<div class="vazio">Nenhuma proposta publicada.</div>';

            return;
        }

        lista.innerHTML =
            dados.map(function(p) {

                return `
                    <div class="item">

                        <h3>
                            ${escapar(p.titulo)}
                        </h3>

                        <p>
                            ${escapar(p.texto)
                                .replace(/\n/g, "<br>")}
                        </p>

                        <small>
                            ID: ${escapar(p.id)}
                        </small>

                        <br><br>

                        <button
                            type="button"
                            class="btn-editar"
                            onclick="editarProposta(${Number(p.id)})">
                            ✏️ Editar
                        </button>

                        <button
                            type="button"
                            class="btn-excluir"
                            onclick="excluirProposta(${Number(p.id)})">
                            🗑️ Excluir
                        </button>

                    </div>
                `;

            }).join("");

    } catch (e) {

        lista.innerHTML =
            '<div class="erroLista">Erro: ' +
            escapar(e.message) +
            '</div>';
    }
}


async function salvarProposta() {

    const titulo =
        document
            .getElementById("propostaTitulo")
            .value
            .trim();

    const texto =
        document
            .getElementById("propostaTexto")
            .value
            .trim();

    if (!titulo || !texto) {

        mostrarMensagem(
            "Preencha o título e o texto da proposta.",
            "erro"
        );

        return;
    }

    try {

        if (propostaEditando !== null) {

            await requisicao(
                "propostas",
                "PATCH",
