.card h2,

}

input,
textarea,
select{

    margin:7px 0 14px;
    border:2px solid #555;

    background:#151515;

textarea{

.btn-editar{

.btn-excluir{

.sucesso{

.erro{

.item h3{

.item small{

<script>

const SUPABASE_URL =
"https://oamvfvyuaqolsswklljp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";


let avisoEditando = null;
let propostaEditando = null;
let construcaoEditando = null;


function mostrarMensagem(texto,tipo="sucesso"){

const el =
document.getElementById("mensagemGlobal");

el.textContent = texto;

el.className =
"mensagem " + tipo;

setTimeout(()=>{
el.className="mensagem";
},4000);

}


function escapar(valor){

return String(valor ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function requisicao(
tabela,
metodo="GET",
dados=null,
query=""
){

let url =
SUPABASE_URL +
"/rest/v1/" +
tabela;

if(query){

url += "?" + query;

}

const opcoes = {

method:metodo,

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Prefer":
"return=representation"

}

};

if(dados !== null){

opcoes.body =
JSON.stringify(dados);

}

const resposta =
await fetch(url,opcoes);

const texto =
await resposta.text();

if(!resposta.ok){

throw new Error(
"Erro " +
resposta.status +
": " +
texto
);

}

if(!texto){

return null;

}

try{

return JSON.parse(texto);

}catch{

return texto;

}

}


/* ABAS */

function abrirAba(nome,botao){

document
.querySelectorAll(".secao")
.forEach(secao =>
secao.classList.remove("ativa")
);

document
.querySelectorAll(".aba")
.forEach(botao =>
botao.classList.remove("ativa")
);

const secao =
document.getElementById(nome);

if(!secao){

return;

}

secao.classList.add("ativa");

if(botao){

botao.classList.add("ativa");

}

if(nome==="avisos")
carregarAvisos();

if(nome==="propostas")
carregarPropostas();

if(nome==="construcoes")
carregarConstrucoes();

if(nome==="solicitacoes")
carregarSolicitacoes();

if(nome==="ideias")
carregarIdeias();

if(nome==="denuncias")
carregarDenuncias();

}


/* AVISOS */

async function carregarAvisos(){

const lista =
document.getElementById("listaAvisos");

lista.innerHTML =
"Carregando...";

try{

const dados =
await requisicao(
"avisos",
"GET",
null,
"select=*&order=id.desc"
);

if(!dados?.length){

lista.innerHTML =
'<div class="vazio">Nenhum aviso publicado.</div>';

return;

}

lista.innerHTML =
dados.map(a=>`

<div class="item">

<h3>
${escapar(a.titulo)}
</h3>

<p>
${escapar(a.texto)
.replace(/\n/g,"<br>")}
</p>

<small>
ID: ${escapar(a.id)}
</small>

<br><br>

<button
class="btn-editar"
onclick="editarAviso(${Number(a.id)})">

✏️ Editar

</button>

<button
class="btn-excluir"
onclick="excluirAviso(${Number(a.id)})">

🗑️ Excluir

</button>

</div>

`).join("");

}catch(e){

lista.innerHTML =
'<div class="vazio">Erro: ' +
escapar(e.message) +
'</div>';

}

}


async function salvarAviso(){

const titulo =
document
.getElementById("avisoTitulo")
.value.trim();

const texto =
document
.getElementById("avisoTexto")
.value.trim();

if(!titulo || !texto){

mostrarMensagem(
"Preencha o título e o texto do aviso.",
"erro"
);

return;

}

try{

if(avisoEditando !== null){

await requisicao(
"avisos",
"PATCH",
{titulo,texto},
"id=eq." +
encodeURIComponent(avisoEditando)
);

mostrarMensagem(
"Aviso atualizado!"
);

}else{

await requisicao(
"avisos",
"POST",
{titulo,texto}
);

mostrarMensagem(
"Aviso publicado!"
);

}

limparFormularioAviso();

carregarAvisos();

}catch(e){

mostrarMensagem(
e.message,
"erro"
);

}

}


async function editarAviso(id){

try{

const dados =
await requisicao(
"avisos",
"GET",
null,
"select=*&id=eq." +
encodeURIComponent(id)
);

if(!dados?.length){

return;

}

document
.getElementById("avisoTitulo")
.value =
dados[0].titulo || "";

document
.getElementById("avisoTexto")
.value =
dados[0].texto || "";

avisoEditando = id;

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(e){

mostrarMensagem(
e.message,
"erro"
);

}

}


async function excluirAviso(id){

if(!confirm(
"Excluir este aviso?"
)){

return;

}

try{

await requisicao(
"avisos",
"DELETE",
null,
"id=eq." +
encodeURIComponent(id)
);

mostrarMensagem(
"Aviso excluído."
);

carregarAvisos();

}catch(e){

mostrarMensagem(
e.message,
"erro"
);

}

}


function limparFormularioAviso(){

document
.getElementById("avisoTitulo")
.value="";

document
.getElementById("avisoTexto")
.value="";

avisoEditando=null;

}

}

dados.map(item=>`
