<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Prefeitura</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1b1b1b;
        color: #f5f5f5;
    }

    header {
        background: #4b2e18;
        border-bottom: 4px solid #2d1b0f;
        padding: 20px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 26px;
    }

        margin: 0;
        color: #ddd;
    }

    .container {
        width: 95%;
        max-width: 1100px;
        margin: 20px auto;
    }

    .abas {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
    }

    .aba {
        border: none;
        background: #333;
        color: white;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .aba:hover,
    .aba.ativa {
        background: #6b451f;
    }

    .secao {
        display: none;
    }

    .secao.ativa {
        display: block;
    }

    .card {
        background: #292929;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 15px;
    }

    .card h2 {
        margin-top: 0;
        color: #ffd27a;
    }

    .formulario {
        background: #252525;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 20px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 12px;
        margin: 7px 0 14px;
        border: 2px solid #555;
        border-radius: 6px;
        background: #151515;
        color: white;
        font-size: 15px;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    button {
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: bold;
        margin: 3px;
    }

    .btn-principal {
        background: #4caf50;
        color: white;
    }

    .btn-editar {
        background: #d69e2e;
        color: white;
    }

    .btn-excluir {
        background: #c0392b;
        color: white;
    }

    .btn-atualizar {
        background: #357edd;
        color: white;
    }

    .btn-cancelar {
        background: #666;
        color: white;
    }

    .mensagem {
        padding: 12px;
        border-radius: 6px;
        margin: 10px 0;
        display: none;
    }

    .sucesso {
        display: block;
        background: #174d25;
        border: 1px solid #2e8b45;
    }

    .erro {
        display: block;
        background: #5c1f1f;
        border: 1px solid #a33;
    }

    .item {
        background: #202020;
        border: 1px solid #444;
        border-radius: 7px;
        padding: 15px;
        margin-top: 12px;
    }

    .item h3 {
        margin-top: 0;
        color: #ffd27a;
    }

    .item small {
        color: #aaa;
    }

    .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 20px;
        font-weight: bold;
        margin: 8px 0;
    }

    .status-analise {
        background: #8a6d1d;
    }

    .status-aprovada {
        background: #245a91;
    }

    .status-andamento {
        background: #a05a18;
    }

    .status-concluida {
        background: #27753b;
    }

    .status-recusada {

    }

    .vazio {
        color: #aaa;

    }

    .codigo {

    }

</style>
</head>

    <section id="construcoes" class="secao">

        <div class="formulario">

            <input id="construcaoTitulo"

            <textarea id="construcaoDescricao"

        <div class="card">

</div>


<script>

const SUPABASE_URL =
    "https://oamvfvyuaqolsswklljp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5ebh8AehOkTaa3XEpcTw2Q_prA9FIFl";


/* ================= FUNÇÕES GERAIS ================= */

function mostrarMensagem(texto, tipo = "sucesso") {

    const elemento = document.getElementById("mensagemGlobal");

    elemento.textContent = texto;

    elemento.className = "mensagem " + tipo;

    setTimeout(() => {
        elemento.className = "mensagem";
    }, 4000);
}


async function requisicao(tabela, metodo, dados = null, id = null) {

    let url = `${SUPABASE_URL}/rest/v1/${tabela}`;

    if (id !== null) {
        url += `?id=eq.${id}`;
    }

    const opcoes = {
        method: metodo,

        headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    };

    if (dados !== null) {
        opcoes.body = JSON.stringify(dados);
    }

    const resposta = await fetch(url, opcoes);

    if (!resposta.ok) {

        const erro = await resposta.text();

        throw new Error(
            `Erro ${resposta.status}: ${erro}`
        );
    }

    if (resposta.status === 204) {
        return null;
    }

    const texto = await resposta.text();

    return texto ? JSON.parse(texto) : null;
}


/* ================= ABAS ================= */

function abrirAba(nome) {

    document.querySelectorAll(".secao")
        .forEach(secao => secao.classList.remove("ativa"));

    document.querySelectorAll(".aba")
        .forEach(botao => botao.classList.remove("ativa"));

    document.getElementById(nome)
        .classList.add("ativa");

    event.target.classList.add("ativa");

    if (nome === "avisos") carregarAvisos();
    if (nome === "propostas") carregarPropostas();
    if (nome === "construcoes") carregarConstrucoes();
    if (nome === "solicitacoes") carregarSolicitacoes();
    if (nome === "ideias") carregarIdeias();
    if (nome === "denuncias") carregarDenuncias();
}


/* ================= AVISOS ================= */

let avisoEditando = null;

async function carregarAvisos() {

    const lista = document.getElementById("listaAvisos");

    lista.innerHTML = "Carregando...";

    try {

        const dados = await requisicao(
            "avisos?select=*&order=id.desc",
            "GET"
        );

        if (!dados || dados.length === 0) {

            lista.innerHTML =
                '<div class="vazio">Nenhum aviso publicado.</div>';

            return;
        }

        lista.innerHTML = dados.map(aviso => `

            <div class="item">

                <h3>${escapar(aviso.titulo)}</h3>

                <p>${escapar(aviso.texto).replace(/\n/g, "<br>")}</p>

                <small>ID: ${aviso.id}</small>

                <br><br>

                <button class="btn-editar"
                    onclick="editarAviso(${aviso.id})">
                    ✏️ Editar
                </button>

                <button class="btn-excluir"
                    onclick="excluirAviso(${aviso.id})">
                    🗑️ Excluir
                </button>

            </div>

        `).join("");

    } catch (erro) {

        lista.innerHTML =
            `<div class="vazio">Erro: ${escapar(erro.message)}</div>`;
    }
}


async function salvarAviso() {

    const titulo =
        document.getElementById("avisoTitulo").value.trim();

    const texto =
        document.getElementById("avisoTexto").value.trim();

    if (!titulo || !texto) {

        mostrarMensagem(
            "Preencha o título e o texto do aviso.",
            "erro"
        );

        return;
    }

    try {

        const dados = {
            titulo,
            texto
        };

        if (avisoEditando !== null) {

            await requisicao(
                "avisos",
                "PATCH",
                dados,
                avisoEditando
            );

            mostrarMensagem("Aviso atualizado!");

        } else {

            await requisicao(
                "avisos",
                "POST",
                dados
            );

            mostrarMensagem("Aviso publicado!");
        }

        limparFormularioAviso();

        carregarAvisos();

    } catch (erro) {

        mostrarMensagem(erro.message, "erro");
    }
}


async function editarAviso(id) {

    try {

        const dados = await requisicao(
            `avisos?select=*&id=eq.${id}`,
            "GET"
        );

        if (!dados.length) return;

        document.getElementById("avisoTitulo").value =
            dados[0].titulo;

        document.getElementById("avisoTexto").value =
            dados[0].texto;

        avisoEditando = id;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (erro) {

        mostrarMensagem(erro.message, "erro");
    }
}


async function excluirAviso(id) {

    if (!confirm("Excluir este aviso?")) return;

    try {

        await requisicao(
            "avisos",
            "DELETE",
            null,
            id
        );

        mostrarMensagem("Aviso excluído.");

        carregarAvisos();

    } catch (erro) {

        mostrarMensagem(erro.message, "erro");
    }
}


function limparFormularioAviso() {

    document.getElementById("avisoTitulo").value = "";
    document.getElementById("avisoTexto").value = "";

    avisoEditando = null;
}
